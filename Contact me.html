<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Bhargav Battula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root { color-scheme: light; --bg:#edf3ec; --surface:rgba(251,252,248,.76); --surface-strong:rgba(255,255,255,.92); --text:#09110c; --muted:#415149; --line:rgba(9,17,12,.09); --accent:#0f6b43; --accent-2:#1d3d2f; --shadow:0 30px 70px rgba(16,28,19,.14); --gradient:linear-gradient(135deg,#0d1510 0%,#173126 32%,#0f6b43 68%,#8faa5a 100%); }
    body.dark-mode { color-scheme: dark; --bg:#06070b; --surface:rgba(16,18,30,.74); --surface-strong:rgba(18,21,34,.94); --text:#f4f5f8; --muted:#9ca3b6; --line:rgba(255,255,255,.08); --accent:#d5b26f; --accent-2:#6d47d9; --shadow:0 32px 84px rgba(0,0,0,.5); --gradient:linear-gradient(135deg,#0b0c12 0%,#1a1f38 28%,#4f2b7f 58%,#7f4b2a 82%,#16746d 100%); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Outfit",sans-serif; color:var(--text); background:radial-gradient(circle at 15% 12%, rgba(15,107,67,.16), transparent 20%),radial-gradient(circle at 82% 18%, rgba(143,170,90,.14), transparent 22%),var(--bg); min-height:100vh; transition:background .4s ease,color .4s ease; }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(1180px, calc(100% - 32px)); margin:20px auto 32px; display:grid; gap:32px; }
    .topbar,.hero { border:1px solid var(--line); background:var(--surface); backdrop-filter:blur(18px); box-shadow:var(--shadow); }
    .topbar { border-radius:999px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .brand { font-family:"Space Grotesk",sans-serif; display:flex; align-items:center; gap:12px; }
    .mark { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; color:white; background:var(--gradient); }
    .top-actions { display:flex; gap:10px; align-items:center; }
    .link-btn,.mode-toggle { padding:11px 15px; border-radius:999px; border:1px solid var(--line); background:var(--surface-strong); color:var(--text); font:inherit; cursor:pointer; transition:transform .25s ease,border-color .25s ease; }
    .link-btn:hover,.mode-toggle:hover { transform:translateY(-4px); border-color:rgba(15,139,255,.3); }
    .hero { border-radius:34px; padding:34px; background:linear-gradient(145deg, rgba(255,255,255,.14), transparent 42%),var(--gradient); color:white; position:relative; overflow:hidden; }
    .hero::after { content:""; position:absolute; width:220px; height:220px; border-radius:999px; background:rgba(255,255,255,.12); top:-60px; right:8%; }
    .hero h1 { margin:0; font-family:"Space Grotesk",sans-serif; font-size:clamp(2.5rem, 5vw, 4.5rem); line-height:.95; max-width:9ch; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:40px; }
    .kicker { color:var(--accent); text-transform:uppercase; letter-spacing:.06em; font-size:.82rem; font-weight:700; }
    .block h2 { font-family:"Space Grotesk",sans-serif; font-size:clamp(1.8rem, 3vw, 2.7rem); line-height:1; margin:14px 0 18px; }
    .line-list { display:grid; gap:18px; }
    .line-item { padding:0 0 18px; border-bottom:1px solid var(--line); }
    .line-item:last-child { border-bottom:none; padding-bottom:0; }
    .line-item strong { display:block; margin-bottom:6px; font-size:1.05rem; }
    .line-item p { color:var(--muted); line-height:1.75; margin:0; }
    .reveal { opacity:0; transform:translateY(28px); transition:opacity .8s ease,transform .8s ease; }
    .reveal.active { opacity:1; transform:translateY(0); }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } .topbar { border-radius:28px; } }
    @media (max-width:560px) { .shell { width:calc(100% - 20px); } .topbar { flex-direction:column; align-items:stretch; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar reveal">
      <a class="brand" href="index.html">
        <span class="mark">BB</span>
        <span><strong>Bhargav Battula</strong><br><span style="color:var(--muted);font-size:.92rem;">Contact hub</span></span>
      </a>
      <div class="top-actions">
        <button class="mode-toggle" type="button" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      </div>
    </header>
    <section class="hero reveal">
      <div class="kicker">Direct Reach</div>
      <h1>Contact</h1>
    </section>
    <section class="grid">
      <article class="block reveal">
        <div class="kicker">Primary Channels</div>
        <h2>Reach Out</h2>
        <div class="line-list">
          <a class="line-item" href="mailto:25cse2006@nitgoa.ac.in"><strong>Email</strong><p>25cse2006@nitgoa.ac.in</p></a>
          <a class="line-item" href="tel:+917286066067"><strong>Phone</strong><p>+91 7286066067</p></a>
          <div class="line-item"><strong>Availability</strong><p>Open to internships, project collaboration, and software roles.</p></div>
        </div>
      </article>
      <aside class="block reveal">
        <div class="kicker">Profiles</div>
        <h2>Links</h2>
        <div class="line-list">
          <a class="line-item" href="https://www.linkedin.com/in/b22in" target="_blank" rel="noreferrer"><strong>LinkedIn</strong><p>linkedin.com/in/b22in</p></a>
          <a class="line-item" href="https://github.com/ZaynVK" target="_blank" rel="noreferrer"><strong>GitHub</strong><p>github.com/ZaynVK</p></a>
        </div>
      </aside>
    </section>
  </div>
  <script>
    const body = document.body;
    const toggle = document.querySelector(".mode-toggle");
    const icon = toggle.querySelector("i");
    const applyTheme = (theme) => {
      const isDark = theme === "dark";
      body.classList.toggle("dark-mode", isDark);
      icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
    };
    applyTheme(localStorage.getItem("portfolio-theme") === "dark" ? "dark" : "light");
    toggle.addEventListener("click", () => {
      const next = body.classList.contains("dark-mode") ? "light" : "dark";
      localStorage.setItem("portfolio-theme", next);
      applyTheme(next);
    });
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("active");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold:.15 });
    document.querySelectorAll(".reveal").forEach((node) => observer.observe(node));
  </script>
</body>
</html>
